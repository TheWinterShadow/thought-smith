# Zensical configuration for Thought Smith docs.

[project]
site_name = "Thought Smith"
site_url = "https://thought-smith.thewintershadow.com"
site_description = "AI-powered journaling app with voice support."
site_author = "TheWinterShadow"
copyright = "Copyright &copy; 2026 TheWinterShadow &mdash; MIT License"
docs_dir = "docs"
site_dir = "site"

repo_name = "TheWinterShadow/thought-smith"
repo_url = "https://github.com/TheWinterShadow/thought-smith"
edit_uri = "edit/main/docs/"

nav = [
  { "🏠 Home" = "index.md" },
  { "📱 Platforms" = [
    { "Android" = "platforms/android.md" },
    { "iOS" = "platforms/ios.md" }
  ]},
  { "📚 API Reference" = [
    { "Android" = [
      { "Repository" = [
        { "AIService" = "api/android/repository/AIService.md" },
        { "FileStorageService" = "api/android/repository/FileStorageService.md" },
        { "SettingsRepository" = "api/android/repository/SettingsRepository.md" }
      ]},
      { "ViewModel" = [
        { "ChatViewModel" = "api/android/viewmodel/ChatViewModel.md" },
        { "SettingsViewModel" = "api/android/viewmodel/SettingsViewModel.md" }
      ]}
    ]},
    { "iOS" = [
      { "Services" = [
        { "AIService" = "api/ios/services/AIService.md" },
        { "FileStorageService" = "api/ios/services/FileStorageService.md" },
        { "SettingsRepository" = "api/ios/services/SettingsRepository.md" },
        { "SpeechService" = "api/ios/services/SpeechService.md" }
      ]},
      { "ViewModels" = [
        { "ChatViewModel" = "api/ios/viewmodels/ChatViewModel.md" },
        { "SettingsViewModel" = "api/ios/viewmodels/SettingsViewModel.md" }
      ]}
    ]}
  ]}
]

# ── Markdown extensions ──────────────────────────────────────────────────────

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index     = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

[project.plugins.search]

# ── Theme ────────────────────────────────────────────────────────────────────

[project.theme]
name = "material"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.path",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "search.share",
  "search.suggest",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "toc.follow",
]

[project.theme.icon]
logo = "fontawesome/solid/book-open"
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
view = "lucide/eye"

[[project.theme.palette]]
media       = "(prefers-color-scheme: light)"
scheme      = "default"
primary     = "purple"
accent      = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media       = "(prefers-color-scheme: dark)"
scheme      = "slate"
primary     = "purple"
accent      = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/TheWinterShadow/thought-smith"
name = "GitHub"
